<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect | Liste des trajets</title>
    <script src="https://cdn.tailwindcss.com "></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <header class="bg-blue-950 text-white mx-auto p-6">
        <h1 class="text-3xl font-bold">BusDirect</h1>
        <p clas>Gestions des trajetes et des réservations </p>
    </header>

    <main class="max-w-6xl mx-auto p-6">
        
        <section class="mb-6">
            <h2 class="text-2xl font-bold mb-4">Liste des trajets</h2>
            <input  type="search" 
                    id="recherche"
                    placeholder="Rechercher une ville"
                    class="w-full p-3 border rounded-lg">
        </section>

        <section id="statistique" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="bg-white p-4 rounded-lg shadaw">
                <h3 class="font-bold"> Nombre de passagers</h3>
                <p id="total-passaagers">0</p>
            </div>
        </section>

        <section>
            <div id="liste-trajets" class="grid grid-cols-1 md:grid-2 lg:grid-cols-3 gap-4">
                <!-- les trajets -->
            </div>
        </section>
    </main>
    <script type="module" src="js/main-trajets.js"></script>
</body>
</html>
