<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect | Cabine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">

    <header class="bg-blue-950 text-white p-6">
        <div class="flex items-center gap-3">
            <img src="img/logo.png" alt="Logo BusDirect" class="h-16">
            <h1 class="text-3xl font-bold">BusDirect</h1>
        </div>
        <a href="index.html" class="underline mt-2 inline-block">Trajets</a>
    </header>

    <main class="max-w-5xl mx-auto p-4">

            <!-- infos de trajet -->
        <div id="infos-trajet" class="bg-white p-4 mb-4">
            <p>......</p>
        </div>

        <div class="grid gap-4 lg:grid-cols-2">

            <section class="bg-white p-4">
                <h2 class="font-bold mb-2">Plan de la cabine</h2>

                <div class="flex gap-4 mb-4">
                    <p><span class="inline-block w-4 h-4 bg-green-500"></span>Libre</p>
                    <p><span class="inline-block w-4 h-4 bg-green-500"></span>VIB</p>
                    <p><span class="inline-block w-4 h-4 bg-green-500"></span>Occupé</p>
                </div>

                <!-- les 20 sieges -->
                <div id="plan-bus"></div>
            </section>

            <div class=" flex flex-col gap-4">

                <!-- reserve -->
                <section class="bg-white p-4">
                    <h2 class="font-bold mb-2">Réserver</h2>
                    <form id="form-reserver">
                        
                        <label for="reserver-nom">Nom</label>
                        <input type="text" id="reserver-nom" class="w-full border p-2"> 
                        <p id="erreur-reserver-nom" class="text-red-600 text-sm"></p>

                        <label for="reserve-tel">Téléphone</label>
                        <input id="reserve-tel" type="text" class="w-full border p-2">
                        <p id="erreur-reserver-tel" class="text-red-600 text-sm"></p>

                        <label for="reserve-siege">Siége</label>
                        <input id="reserve-siege" class="w-full border" p-2>
                            <option value="">Premiere siége Libre</option>

                            <button type="submit" class="bg-blue-700 text-white p-2">Réserver</button>
                    </form>
                    <p id="message-reserve" class="text green-700 mt-2"></p>
                </section>

                    <!-- Modifier -->
                <section class="bg-white p-4">
                    <h2 class="font-bold mb-2">Modifier</h2>
                    <form id="form-modifier">

                        <label for="modifier-passager">Passager</label>
                        <select id="modifier-passager" class="w-full border p-2">
                            <option value="">Choisir un passager</option>
                        </select>

                        <label for="modifier-nom">Nom</label>
                        <input type="text" id="modifier-nom" class="w-full border p-2">
                        <p id="erreur-modifier-tel" class="text-red-600 text-sm"></p>

                        <label for="modifier-tel">Téléphone</label>
                        <input id="reserve-tel" type="text" class="w-full border p-2">
                        <p id="erreur-reserver-tel" class="text-red-600 text-sm"></p>

                        <label for="modifier-siege">Siége</label>
                        <select id="modifier-siege" class="w-full border" p-2 >
                        <button type="submit" class="bg-blue-700 text-white p-2"></button>    
                    </form>
                    <p id="message-modifier" class="text green-700 mt-2"></p>
                </section>

                <!-- Annuler -->
                 <section class="bg-white p-4">
                    <h2 class="font-bold mb-2">Annuler</h2>
                    <form id="form-annuler">

                        <label for="annuler-passager">Passager</label>
                        <select id="annuler-passager" class="w-full border p-2 mb-2">
                            <option value="">Choisir un passager</option>
                        </select>

                        <button type="submit" class="bg-red-600 text-white p-2">Annuler</button>
                    </form>
                    <p id="message-annuler" class="text-green-700 mt-2"></p>
                 </section>

                 <!-- liste d'attente -->
                  <section class="bg-white p-4">
                    <h2 class="font-bold mb-2">Liste d'attente</h2>
                    <form id="form-attente">

                        <label for="attente-nom">Nom</label>
                        <input type="text" id="attente-nom" class="w-full border p-2">
                        <p id="erreur-attente-nom" class="text-red-600 text-sm"></p>

                        <label for="attente-tel">Téléphone</label>
                        <input type="text" id="attente-tel" class="w-full border p-2">
                        <p id="erreur-attente-tel" class="text-red-600 text-sm"></p>
                        <button type="submit" class="bg-blue-700 text-white p-2 mt-2"></button> 
                    </form>
                     <p id="message-attente" class="text-green-700 mt-2"></p>

                     <ul id="liste-attente" class="text-green-700 mt-2"></ul>
                  </section>
            </div>
        </div>
    </main>
    <script type="module" src="js/main-cabine.js"></script>
    
</body>
</html>
